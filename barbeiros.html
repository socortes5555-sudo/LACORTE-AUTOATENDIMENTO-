<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>LaCorte | Área Profissional</title>
  <link rel="stylesheet" href="styles.css?v=20261111-mobile-fix1">
<style id="lacorte-mobile-layout">
html{width:100%;min-width:0;overflow-x:hidden}
body.staff-portal{width:100%;min-width:0;overflow-x:hidden}
body.staff-portal .shell,body.staff-portal .staff-shell{box-sizing:border-box;width:100%;min-width:0;max-width:100%;margin:0 auto}
body.staff-portal #step-content,body.staff-portal .panel,body.staff-portal .panel-heading{min-width:0;max-width:100%}
body.staff-portal img{max-width:100%;height:auto}
@media(max-width:767px){
 body.staff-portal .topbar{height:auto;min-height:72px;padding:12px 16px;gap:12px;flex-wrap:wrap}
 body.staff-portal .brand-logo{max-width:160px;max-height:65px;object-fit:contain}
 body.staff-portal .shell,body.staff-portal .staff-shell{padding:16px 12px 28px!important;margin:0!important}
 body.staff-portal .panel{display:block!important;padding:16px!important;border-radius:14px!important;min-height:180px}
 body.staff-portal .panel-heading{display:block!important}
 body.staff-portal #step-content{display:block;overflow-wrap:anywhere}
 body.staff-portal .admin-nav{position:static!important;min-height:0!important;width:100%!important;max-width:100%!important}
 body.staff-portal #step-content:has(.admin-nav){display:flex!important;flex-direction:column!important;gap:12px!important}
 body.staff-portal #step-content>.admin-nav,body.staff-portal #step-content>.admin-nav~*{grid-column:auto!important;grid-row:auto!important;width:100%;min-width:0}
 body.staff-portal .admin-kpis,body.staff-portal .report-kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 body.staff-portal .report-chart-grid{grid-template-columns:1fr!important}
 body.staff-portal .actions{display:flex;flex-wrap:wrap;gap:8px}
 body.staff-portal .actions .btn{min-width:0}
 body.staff-portal input,body.staff-portal select,body.staff-portal textarea{max-width:100%;font-size:16px}
 body.staff-portal .report-table-wrap{overflow-x:auto}
}
@media(max-width:380px){body.staff-portal .admin-kpis,body.staff-portal .report-kpis{grid-template-columns:1fr!important}}
</style>
</head>
<body class="staff-portal">
  <header class="topbar">
    <a class="brand" href="barbeiros.html" aria-label="LaCorte área profissional"><img class="brand-logo" src="assets/lacorte-logo.svg" alt="LaCorte Barbershop"></a>
    <span class="top-label">ÁREA PROFISSIONAL</span>
  </header>
  <main class="shell staff-shell">
    <section class="panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow" id="step-kicker">ACESSO RESTRITO • EQUIPE LACORTE</p>
          <h2 id="step-title">Painel dos profissionais</h2>
          <p class="muted" id="step-description">Entre com seu e-mail e senha cadastrados pelo administrador.</p>
        </div>
      </div>
      <div id="step-content" aria-live="polite">
        <form id="staff-login-form" class="staff-login-form">
          <label for="staff-email">E-mail profissional</label>
          <input id="staff-email" name="email" type="email" autocomplete="username" placeholder="seuemail@lacorte.com" required>
          <label for="staff-password">Senha</label>
          <input id="staff-password" name="password" type="password" autocomplete="current-password" placeholder="Sua senha" required>
          <button class="btn btn-primary" type="submit">ENTRAR NO PAINEL</button>
        </form>
      </div>
      <div class="notice" id="demo-notice">Acesso exclusivo para barbeiros e administrador. O cliente deve utilizar o autoatendimento.</div>
      <div class="actions" id="step-actions"></div>
    </section>
    <footer>LA<span>CORTE</span><b>.</b><small><a href="./">Voltar ao autoatendimento do cliente</a></small></footer>
  </main>
  <script>
  (function(){
    const content=document.getElementById("step-content");
    const notice=document.getElementById("demo-notice");
    function error(message){
      content.innerHTML="";
      const p=document.createElement("p");p.className="notice";p.setAttribute("role","alert");
      p.textContent=message;content.appendChild(p);
    }
    function load(src){return new Promise((resolve,reject)=>{
      const script=document.createElement("script");script.src=src;
      script.onload=resolve;script.onerror=()=>reject(new Error("Falha ao carregar "+src));
      document.head.appendChild(script);
    });}
    window.addEventListener("error",e=>{if(e.filename&&/app\\.js|supabase/i.test(e.filename))error("Erro ao iniciar o painel: "+e.message);});
    async function start(){
      try{
        try{await load("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js");}
        catch(e){await load("https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js");}
        if(!window.supabase?.createClient)throw new Error("Biblioteca Supabase indisponível.");
        await load("app.js?v=20261111-mobile-fix1");
      }catch(e){error("Não foi possível carregar o painel. Verifique a conexão e atualize a página. Detalhes: "+e.message);}
    }
    start();
  })();
  </script>
</body>
</html>
