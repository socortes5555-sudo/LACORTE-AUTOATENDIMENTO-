name: CI - LaCorte

on:
  push:
    branches:
      - "automation/**"
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validar aplicação e fluxos principais
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate synchronized release metadata for privacy correction
        if: github.event_name == 'push' && github.ref == 'refs/heads/automation/wifi-privacy-20261117'
        run: node scripts/release.mjs

      - name: Commit synchronized release metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/automation/wifi-privacy-20261117'
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cliente/index.html barbeiros.html equipe/index.html version.json
          git commit -m "chore: synchronize release metadata"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verificar publicação dos aplicativos
        run: node scripts/release.mjs --check

      - name: Verificar sintaxe JavaScript
        run: |
          node --check app.js
          node --check admin.js
          node --check barber.js

      - name: Executar testes de fumaça
        run: node --test tests/*.test.mjs
