name: CI - LaCorte

on:
  push:
    branches:
      - main
      - "automation/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar aplicação e fluxos principais
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verificar sintaxe JavaScript
        run: node --check app.js

      - name: Executar testes de fumaça
        run: node --test tests/*.test.mjs
