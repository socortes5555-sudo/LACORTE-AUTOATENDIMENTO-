name: Sync release metadata for Wi-Fi privacy fix
on:
  push:
    branches:
      - fix/public-wifi-qr-privacy-20261117
permissions:
  contents: write
jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate synchronized release version
        run: node scripts/release.mjs
      - name: Commit release metadata
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cliente/index.html barbeiros.html equipe/index.html version.json
          git commit -m "chore: synchronize release metadata"
          git push
