name: LaCorte validation and release
on:
  push:
    branches: [feature/clube-fila-online-design]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          find . -name '*.mjs' -not -path './node_modules/*' -print0 | xargs -0 -r -n1 node --check
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -r -n1 node --check
      - name: Synchronize release assets
        run: node scripts/release.mjs
      - name: Run automated tests
        run: node --test tests/*.test.mjs
      - name: Verify release consistency
        run: node scripts/release.mjs --check
      - name: Commit synchronized release files to development branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/clube-fila-online-design'
        run: |
          if ! git diff --quiet -- index.html cliente/index.html barbeiros.html equipe/index.html version.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html cliente/index.html barbeiros.html equipe/index.html version.json
            git commit -m 'chore: synchronize LaCorte release version'
            git push
          fi
