<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0d0d"><title>LaCorte | Confirmar Pix</title><link rel="stylesheet" href="fila-online.css"></head><body><main class="wrap"><header><img src="assets/lacorte-logo.svg" alt="La Corte Barbearia"><span class="tag">Admin • Pix</span></header><h1>Confirmação de pagamentos</h1><p>Confira o dinheiro recebido na sua conta bancária antes de liberar uma senha. Um comprovante isolado não garante o recebimento.</p><section id="login" class="card"><h2>Acesso administrativo</h2><form id="loginForm" class="stack"><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button>Entrar</button></form></section><section id="app" class="hidden"><div class="row"><span>Pedidos aguardando Pix</span><button id="refresh" class="secondary">Atualizar</button><button id="logout" class="secondary">Sair</button></div><div id="pending"></div></section><p class="status" id="message" role="status" aria-live="polite">Acesso exclusivo do administrador.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module">
import {listPendingWhatsAppOrders,approveWhatsAppOrder} from "./integrations/whatsapp-manual-queue.mjs";
const db=window.supabase.createClient("https://xwctsfpqwugygxpsrcfw.supabase.co","sb_publishable_L274hUI6sbyDGFe7u40U-Q_tK28Oh5s",{auth:{detectSessionInUrl:false}});
const el=id=>document.getElementById(id),msg=s=>el("message").textContent=s;
const money=n=>Number(n).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
async function load(){try{const rows=await listPendingWhatsAppOrders(db);el("pending").replaceChildren();if(!rows.length){el("pending").textContent="Nenhum pedido pendente.";return;}for(const r of rows){const card=document.createElement("div");card.className="card";const h=document.createElement("h2");h.textContent=r.customer_name;const p=document.createElement("p");p.textContent=r.service_name+" • "+money(r.amount)+" • Pedido "+r.order_id;const b=document.createElement("button");b.textContent="Confirmei o Pix na conta • Liberar senha";b.onclick=async()=>{if(!confirm("Você conferiu o crédito de "+money(r.amount)+" na sua conta bancária? A senha será gerada agora."))return;b.disabled=true;try{const result=await approveWhatsAppOrder(db,r.order_id);msg("Pagamento confirmado. Senha #"+result.ticket_number+" liberada na fila.");await load()}catch(e){msg("Erro: "+e.message);b.disabled=false}};card.append(h,p,b);el("pending").append(card)}}catch(e){msg("Acesso negado ou erro: "+e.message);el("pending").replaceChildren()}}
async function init(){const {data:{session}}=await db.auth.getSession();el("login").classList.toggle("hidden",!!session);el("app").classList.toggle("hidden",!session);if(session)await load()}
el("loginForm").onsubmit=async e=>{e.preventDefault();try{const {error}=await db.auth.signInWithPassword({email:el("email").value,password:el("password").value});if(error)throw error;await init()}catch(x){msg("Erro ao entrar: "+x.message)}};
el("refresh").onclick=load;el("logout").onclick=async()=>{await db.auth.signOut();await init()};init().catch(e=>msg(e.message));
</script></body></html>
